<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>理科 振り返りノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper:#F5F6F1;
    --paper-line:#DAD9CC;
    --ink:#232B27;
    --ink-soft:#5B6660;
    --teal:#2E6B70;
    --teal-deep:#1F4E52;
    --amber:#B8792F;
    --sage:#4F7A5E;
    --sage-bg:#EBF1EC;
    --amber-bg:#F7EEE0;
    --danger:#A64B44;
    --radius:10px;
    --maxw:660px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image: linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 34px;
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    margin:0 0 .3em;
    letter-spacing:.02em;
  }
  .wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding:28px 20px 80px;
  }
  .topline{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
    margin-bottom:22px;
  }
  .topline h1{font-size:1.35rem;color:var(--teal-deep);}
  .topline .who{font-size:.85rem;color:var(--ink-soft);}

  /* ---- form ---- */
  .card{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:26px;
    box-shadow:0 1px 0 rgba(0,0,0,.03);
  }
  label{display:block;font-size:.82rem;color:var(--ink-soft);margin-bottom:6px;}
  input[type=text], textarea, select{
    width:100%;
    font-family:inherit;
    font-size:1rem;
    padding:10px 12px;
    border:1px solid var(--paper-line);
    border-radius:8px;
    background:#FCFCFA;
    color:var(--ink);
    resize:vertical;
  }
  input[type=text]:focus, textarea:focus, select:focus{
    outline:2px solid var(--teal);
    outline-offset:1px;
    border-color:var(--teal);
  }
  .field{margin-bottom:14px;}
  textarea{min-height:120px;}
  .charcount{font-size:.75rem;color:var(--ink-soft);text-align:right;margin-top:4px;}
  button{
    font-family:inherit;
    font-size:.95rem;
    font-weight:700;
    border:none;
    border-radius:8px;
    padding:11px 20px;
    cursor:pointer;
    transition:transform .08s ease, background .15s ease;
  }
  button:active{transform:scale(.98);}
  .btn-main{background:var(--teal-deep);color:#fff;}
  .btn-main:hover{background:var(--teal);}
  .btn-main:disabled{background:#B9C4C1;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--teal-deep);border:1px solid var(--teal-deep);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-small{padding:5px 10px;font-size:.78rem;border-radius:6px;}
  .msg{font-size:.85rem;margin-top:10px;}
  .msg.err{color:var(--danger);}
  .msg.ok{color:var(--sage);}

  /* ---- lesson tier tabs ---- */
  .tier{margin-bottom:14px;}
  .tier-label{font-size:.72rem;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.05em;}
  .lesson-tabs{display:flex;gap:8px;flex-wrap:wrap;}
  .lesson-tab{
    background:#fff;border:1px solid var(--paper-line);color:var(--ink-soft);
    border-radius:20px;padding:7px 14px;font-size:.85rem;font-weight:500;
  }
  .lesson-tab.active{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff;}

  /* ---- timeline ---- */
  .timeline{position:relative;padding-left:22px;}
  .timeline::before{
    content:'';
    position:absolute;left:6px;top:6px;bottom:6px;
    width:2px;background:var(--paper-line);
  }
  .entry{position:relative;margin-bottom:22px;}
  .entry::before{
    content:'';
    position:absolute;left:-22px;top:6px;
    width:11px;height:11px;border-radius:50%;
    background:var(--teal);border:2px solid #fff;
    box-shadow:0 0 0 1px var(--paper-line);
  }
  .entry.pending::before{background:var(--amber);}
  .entry-date{font-size:.78rem;color:var(--ink-soft);margin-bottom:4px;}
  .entry-text{white-space:pre-wrap;font-size:.95rem;margin-bottom:10px;}
  .grade-box{
    border-radius:8px;
    padding:12px 14px;
    font-size:.9rem;
  }
  .grade-box.graded{background:var(--sage-bg);border:1px solid #cfe0d3;}
  .grade-box.pending{background:var(--amber-bg);border:1px solid #ecdcbf;color:var(--amber);}
  .score{font-family:'Shippori Mincho',serif;font-weight:700;color:var(--sage);font-size:1rem;margin-bottom:4px;}
  .empty{color:var(--ink-soft);font-size:.9rem;padding:20px 0;}

  /* ---- admin ---- */
  .admin-item{
    background:#fff;border:1px solid var(--paper-line);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;
  }
  .admin-item .meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--ink-soft);margin-bottom:6px;}
  .admin-item .badge{
    display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:20px;
    background:var(--sage-bg);color:var(--sage);margin-left:8px;
  }
  .admin-item .badge.err{background:#f6e2e0;color:var(--danger);}
  .row2{display:flex;gap:10px;flex-wrap:wrap;}
  .row2 > *{flex:1;min-width:140px;}
  footer.note{font-size:.78rem;color:var(--ink-soft);margin-top:30px;border-top:1px solid var(--paper-line);padding-top:14px;}
  .link-btn{background:none;border:none;color:var(--teal-deep);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:0;}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---- lesson settings page ---- */
  .tani-group{margin-bottom:18px;}
  .tani-title{font-family:'Shippori Mincho',serif;font-weight:700;font-size:1.02rem;margin-bottom:8px;}
  .sho-group{margin-bottom:10px;padding-left:12px;border-left:2px solid var(--paper-line);}
  .sho-title{font-size:.85rem;color:var(--ink-soft);margin-bottom:6px;}
  .koji-chip{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--sage-bg);border:1px solid #cfe0d3;color:var(--sage);
    border-radius:16px;padding:4px 10px;font-size:.8rem;margin:0 6px 6px 0;
  }
  .koji-chip button{background:none;border:none;color:var(--danger);font-weight:700;padding:0;cursor:pointer;font-size:.85rem;line-height:1;}
  .add-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .add-row input{flex:1;min-width:100px;}
</style>
</head>
<body>
<div id="app" class="wrap"><p class="empty">読み込み中…</p></div>

<script>
/* ===== 設定: Firebaseコンソールで取得した設定値をここに貼り付ける ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCWlgK3s4d2JyJEqWGGsdjRsIewRCqZsGM",
  authDomain: "furikaeri-e4d8e.firebaseapp.com",
  projectId: "furikaeri-e4d8e",
  storageBucket: "furikaeri-e4d8e.firebasestorage.app",
  messagingSenderId: "761792915713",
  appId: "1:761792915713:web:3ea425d52d5db456311300"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ===== ルーティング ===== */
const params = new URLSearchParams(location.search);
const studentToken = params.get('s');
const isAdmin = params.get('admin') === '1';
const app = document.getElementById('app');

if (studentToken) {
  renderStudent(studentToken);
} else if (isAdmin) {
  renderAdminGate();
} else {
  renderLanding();
}

function renderLanding(){
  app.innerHTML = `
    <div class="topline"><h1>理科 振り返りノート</h1></div>
    <div class="card">
      <p>このページは、先生から配布された個人リンクを開いて使います。</p>
      <p style="color:var(--ink-soft);font-size:.85rem;">生徒の方は先生から届いたURLをブックマークしてください。</p>
    </div>
    <footer class="note"><button class="link-btn" onclick="location.search='?admin=1'">先生用ページ</button></footer>
  `;
}

/* ---------------- 共通ヘルパー ---------------- */
function fmtDate(d){
  const dt = (d && typeof d.toDate === 'function') ? d.toDate() : new Date(d);
  if (isNaN(dt)) return '';
  return dt.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'}) + ' ' +
         dt.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function lessonFullName(l){
  return [l.tani, l.sho, l.koji].filter(Boolean).join(' ');
}
async function getLessons(){
  const doc = await db.collection('lessons').doc('config').get();
  return doc.exists ? (doc.data().tree || []) : [];
}

/* ---------------- 生徒ページ ---------------- */
let currentSel = { tani:null, sho:null, koji:null };
let allEntries = [];
let lessonList = [];
let studentName = '';

function renderStudent(token){
  app.innerHTML = `<p class="empty">読み込み中…</p>`;
  Promise.all([
    db.collection('students').doc(token).get(),
    db.collection('reflections').where('studentId','==',token).get(),
    getLessons()
  ]).then(([studentSnap, reflSnap, lessons])=>{
    if (!studentSnap.exists){
      app.innerHTML = `<div class="card"><p class="msg err">無効なリンクです。先生に確認してください。</p></div>`;
      return;
    }
    studentName = studentSnap.data().name;
    allEntries = reflSnap.docs.map(d => ({ id:d.id, ...d.data() }))
      .sort((a,b) => (b.ts && b.ts.toDate ? b.ts.toDate() : new Date(b.ts)) - (a.ts && a.ts.toDate ? a.ts.toDate() : new Date(a.ts)));
    lessonList = lessons;

    if (lessonList.length){
      const last = lessonList[lessonList.length - 1];
      currentSel = { tani: last.tani, sho: last.sho, koji: last.koji };
    } else {
      currentSel = { tani:null, sho:null, koji:null };
    }

    app.innerHTML = `
      <div class="topline">
        <h1>理科 振り返りノート</h1>
        <span class="who">${esc(studentName)} さん</span>
      </div>

      <div id="lessonNav"></div>

      <div class="card">
        <h2 style="font-size:1rem;" id="formTitle"></h2>
        <div class="field">
          <label for="text">振り返り</label>
          <textarea id="text" maxlength="1000" placeholder="今日の授業でわかったこと、疑問に思ったこと、次にやってみたいことなどを書こう"></textarea>
          <div class="charcount"><span id="cc">0</span>/1000</div>
        </div>
        <button class="btn-main" id="submitBtn">提出する</button>
        <div class="msg" id="submitMsg"></div>
      </div>

      <h2 style="font-size:1rem;color:var(--ink-soft);" id="timelineTitle">これまでの記録</h2>
      <div class="timeline" id="timeline"></div>
    `;

    renderLessonNav();
    updateStudentView();

    const textEl = document.getElementById('text');
    textEl.addEventListener('input', ()=>{document.getElementById('cc').textContent = textEl.value.length;});

    document.getElementById('submitBtn').addEventListener('click', async ()=>{
      const text = textEl.value.trim();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('submitMsg');
      if (!currentSel.koji){ msg.className='msg err'; msg.textContent='授業(単元・章・校時)を選んでください。'; return; }
      if (!text){ msg.className='msg err'; msg.textContent='振り返りを入力してください。'; return; }
      const lessonName = lessonFullName(currentSel);
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>送信中…';
      try {
        await db.collection('reflections').add({
          studentId: token,
          studentName: studentName,
          ts: firebase.firestore.FieldValue.serverTimestamp(),
          lesson: lessonName,
          text: text,
          score: '',
          comment: ''
        });
        btn.disabled = false; btn.textContent = '提出する';
        msg.className='msg ok'; msg.textContent = '提出しました。AIの評価がつくまで少し待ってね。';
        textEl.value=''; document.getElementById('cc').textContent='0';
        allEntries = [{id:null, ts:new Date(), lesson:lessonName, text:text, score:'', comment:''}].concat(allEntries);
        updateStudentView();
      } catch (err){
        btn.disabled = false; btn.textContent = '提出する';
        msg.className='msg err'; msg.textContent = '送信に失敗しました。ネットワーク接続を確認してください。';
      }
    });
  }).catch(()=>{
    app.innerHTML = `<div class="card"><p class="msg err">通信に失敗しました。ネットワーク接続を確認してください。</p></div>`;
  });
}

function renderLessonNav(){
  const el = document.getElementById('lessonNav');
  if (!lessonList.length){
    el.innerHTML = '<p class="empty">先生が授業構成を登録すると、ここに単元・章・校時のタブが表示されます。</p>';
    return;
  }
  const tanis = [...new Set(lessonList.map(l=>l.tani))];
  const shos = [...new Set(lessonList.filter(l=>l.tani===currentSel.tani).map(l=>l.sho))];
  const kojis = lessonList.filter(l=>l.tani===currentSel.tani && l.sho===currentSel.sho);

  el.innerHTML = `
    <div class="tier"><div class="tier-label">単元</div><div class="lesson-tabs" id="taniTabs">
      ${tanis.map(t=>`<button class="lesson-tab ${t===currentSel.tani?'active':''}" data-v="${esc(t)}">${esc(t)}</button>`).join('')}
    </div></div>
    ${shos.length ? `<div class="tier"><div class="tier-label">章</div><div class="lesson-tabs" id="shoTabs">
      ${shos.map(s=>`<button class="lesson-tab ${s===currentSel.sho?'active':''}" data-v="${esc(s)}">${esc(s)}</button>`).join('')}
    </div></div>` : ''}
    ${kojis.length ? `<div class="tier"><div class="tier-label">校時</div><div class="lesson-tabs" id="kojiTabs">
      ${kojis.map(l=>`<button class="lesson-tab ${l.koji===currentSel.koji?'active':''}" data-v="${esc(l.koji)}">${esc(l.koji)}</button>`).join('')}
    </div></div>` : ''}
  `;

  const taniTabs = document.getElementById('taniTabs');
  if (taniTabs) taniTabs.querySelectorAll('.lesson-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentSel.tani = btn.dataset.v;
      const firstSho = lessonList.find(l=>l.tani===currentSel.tani);
      currentSel.sho = firstSho ? firstSho.sho : null;
      const firstKoji = lessonList.find(l=>l.tani===currentSel.tani && l.sho===currentSel.sho);
      currentSel.koji = firstKoji ? firstKoji.koji : null;
      renderLessonNav(); updateStudentView();
    });
  });
  const shoTabs = document.getElementById('shoTabs');
  if (shoTabs) shoTabs.querySelectorAll('.lesson-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentSel.sho = btn.dataset.v;
      const firstKoji = lessonList.find(l=>l.tani===currentSel.tani && l.sho===currentSel.sho);
      currentSel.koji = firstKoji ? firstKoji.koji : null;
      renderLessonNav(); updateStudentView();
    });
  });
  const kojiTabs = document.getElementById('kojiTabs');
  if (kojiTabs) kojiTabs.querySelectorAll('.lesson-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentSel.koji = btn.dataset.v;
      renderLessonNav(); updateStudentView();
    });
  });
}

function updateStudentView(){
  const name = lessonFullName(currentSel);
  document.getElementById('formTitle').textContent = name ? name + ' の振り返りを書く' : '振り返りを書く';
  document.getElementById('timelineTitle').textContent = name ? name + ' のこれまでの記録' : 'これまでの記録';
  const filtered = name ? allEntries.filter(en => en.lesson === name) : allEntries;
  renderTimeline(filtered);
}

function renderTimeline(entries){
  const el = document.getElementById('timeline');
  if (!entries.length){
    el.innerHTML = '<p class="empty">まだ記録がありません。</p>';
    return;
  }
  el.innerHTML = entries.map(en=>{
    const graded = en.score !== '' && en.score !== undefined && en.score !== null;
    return `
      <div class="entry ${graded?'':'pending'}">
        <div class="entry-date">${fmtDate(en.ts)}</div>
        <div class="entry-text">${esc(en.text)}</div>
        ${graded
          ? `<div class="grade-box graded"><div class="score">評価: ${esc(en.score)}</div>${esc(en.comment)}</div>`
          : `<div class="grade-box pending">AI評価待ち</div>`}
      </div>`;
  }).join('');
}

/* ---------------- 先生ページ ---------------- */
async function checkOrSetAdminPassword(pw){
  const ref = db.collection('admin').doc('config');
  const snap = await ref.get();
  if (!snap.exists){
    await ref.set({ password: pw });
    return true;
  }
  return snap.data().password === pw;
}

function renderAdminGate(){
  const savedKey = localStorage.getItem('reflect_admin_pw') || '';
  const savedApiKey = localStorage.getItem('reflect_anthropic_key') || '';
  const savedRubric = localStorage.getItem('reflect_rubric') || '';
  app.innerHTML = `
    <div class="topline"><h1>理科 振り返りノート — 先生用</h1></div>
    <div class="card">
      <div class="field">
        <label for="pw">管理者の合言葉</label>
        <input type="text" id="pw" value="${esc(savedKey)}">
      </div>
      <div class="field">
        <label for="apikey">Anthropic APIキー(この端末にのみ保存されます)</label>
        <input type="text" id="apikey" value="${esc(savedApiKey)}" placeholder="sk-ant-...">
      </div>
      <div class="field">
        <label for="rubric">AIに伝える評価基準(任意・この端末にのみ保存されます)</label>
        <textarea id="rubric" placeholder="例: 5点満点。具体的な数値や実験結果への言及があれば+1点。疑問点や次に調べたいことが書かれていれば+1点。">${esc(savedRubric)}</textarea>
      </div>
      <button class="btn-main" id="goBtn">入る</button>
      <div class="msg err" id="gateMsg"></div>
    </div>
  `;
  document.getElementById('goBtn').addEventListener('click', async ()=>{
    const pw = document.getElementById('pw').value.trim();
    const apikey = document.getElementById('apikey').value.trim();
    const rubric = document.getElementById('rubric').value.trim();
    const msg = document.getElementById('gateMsg');
    if (!pw || !apikey){
      msg.textContent = '合言葉とAPIキーの両方を入力してください。';
      return;
    }
    const btn = document.getElementById('goBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>確認中…';
    try {
      const ok = await checkOrSetAdminPassword(pw);
      btn.disabled = false; btn.textContent = '入る';
      if (!ok){ msg.textContent = '合言葉が違います。'; return; }
      localStorage.setItem('reflect_admin_pw', pw);
      localStorage.setItem('reflect_anthropic_key', apikey);
      localStorage.setItem('reflect_rubric', rubric);
      renderAdminHub(pw, apikey, rubric);
    } catch (err){
      btn.disabled = false; btn.textContent = '入る';
      msg.textContent = '通信に失敗しました。ネットワーク接続を確認してください。';
    }
  });
}

function renderAdminHub(pw, apikey, rubric){
  app.innerHTML = `
    <div class="topline"><h1>理科 振り返りノート — 先生用</h1></div>
    <div class="card row2">
      <button class="btn-main" id="goUngraded">未評価を評価する</button>
      <button class="btn-ghost" id="goList">評価の一覧を見る</button>
      <button class="btn-ghost" id="goLessons">授業構成を設定する</button>
    </div>
    <footer class="note"><button class="link-btn" onclick="renderAdminGate()">合言葉・APIキー・評価基準を変更</button></footer>
  `;
  document.getElementById('goUngraded').addEventListener('click', ()=>loadUngraded(pw, apikey, rubric));
  document.getElementById('goList').addEventListener('click', ()=>renderGradedList(pw, apikey, rubric));
  document.getElementById('goLessons').addEventListener('click', ()=>renderLessonSettings(pw, apikey, rubric));
}

function loadUngraded(pw, apikey, rubric){
  app.innerHTML = `<p class="empty">読み込み中…</p>`;
  db.collection('reflections').where('score','==','').get().then(snap=>{
    const items = snap.docs.map(d => ({ id:d.id, ...d.data() }))
      .sort((a,b) => (a.ts && a.ts.toDate ? a.ts.toDate() : new Date(a.ts)) - (b.ts && b.ts.toDate ? b.ts.toDate() : new Date(b.ts)));
    app.innerHTML = `
      <div class="topline"><h1>未評価の振り返り</h1><span class="who">${items.length}件</span></div>
      ${items.length ? `<div class="card row2">
          <button class="btn-main" id="gradeAllBtn">すべてAIで評価する</button>
          <button class="btn-ghost" id="backBtn">先生用トップに戻る</button>
        </div>` : `<div class="card"><p>未評価の振り返りはありません。</p>
        <button class="btn-ghost" id="backBtn">先生用トップに戻る</button></div>`}
      <div id="items"></div>
    `;
    document.getElementById('backBtn').addEventListener('click', ()=>renderAdminHub(pw, apikey, rubric));
    const itemsEl = document.getElementById('items');
    itemsEl.innerHTML = items.map(it => `
      <div class="admin-item" id="item-${it.id}">
        <div class="meta"><span>${esc(it.studentName)} / ${fmtDate(it.ts)}</span><span id="status-${it.id}">未評価</span></div>
        <div style="font-family:'Shippori Mincho',serif;font-weight:700;margin-bottom:4px;">${esc(it.lesson)}</div>
        <div style="font-size:.9rem;">${esc(it.text)}</div>
      </div>
    `).join('');

    if (items.length){
      document.getElementById('gradeAllBtn').addEventListener('click', ()=>gradeAll(items, apikey, rubric));
    }
  }).catch(()=>{
    app.innerHTML = `<div class="card"><p class="msg err">通信に失敗しました。</p></div>`;
  });
}

async function gradeAll(items, apikey, rubric){
  const btn = document.getElementById('gradeAllBtn');
  btn.disabled = true;
  for (const it of items){
    const statusEl = document.getElementById('status-'+it.id);
    statusEl.textContent = '評価中…';
    try {
      const grade = await gradeWithClaude(it, apikey, rubric);
      await db.collection('reflections').doc(it.id).update({
        score: grade.score,
        comment: grade.comment,
        gradedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      statusEl.innerHTML = `<span class="badge">評価済 ${esc(grade.score)}</span>`;
    } catch (err){
      statusEl.innerHTML = `<span class="badge err">失敗</span>`;
    }
  }
  btn.textContent = '完了しました';
}

async function gradeWithClaude(item, apikey, rubric){
  const prompt = `あなたは中学校理科の先生です。生徒が書いた授業の振り返りを読み、次の2点を出力してください。
1. 5点満点の評価点(整数)
2. 生徒への短いコメント(2〜3文、日本語、励ましを含めた具体的なフィードバック)

${rubric ? '評価基準(先生の指定):\n' + rubric + '\n' : '評価基準の指定はありません。理解の深さ・具体性・自分の言葉での説明を基準にしてください。\n'}
単元: ${item.lesson || '(未記入)'}
生徒の振り返り:
"""
${item.text}
"""

出力は必ず次のJSON形式のみで返してください。他の文章は含めないこと。
{"score": 数値, "comment": "コメント本文"}`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apikey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 300,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if (!res.ok) throw new Error('API error ' + res.status);
  const data = await res.json();
  const textBlock = (data.content || []).find(b => b.type === 'text');
  if (!textBlock) throw new Error('no text');
  const match = textBlock.text.match(/\{[\s\S]*\}/);
  if (!match) throw new Error('parse error');
  const parsed = JSON.parse(match[0]);
  return { score: parsed.score, comment: parsed.comment };
}

function renderGradedList(pw, apikey, rubric){
  app.innerHTML = `<p class="empty">読み込み中…</p>`;
  Promise.all([
    db.collection('reflections').get(),
    getLessons()
  ]).then(([snap, lessons])=>{
    const items = snap.docs.map(d => ({ id:d.id, ...d.data() }))
      .sort((a,b) => (b.ts && b.ts.toDate ? b.ts.toDate() : new Date(b.ts)) - (a.ts && a.ts.toDate ? a.ts.toDate() : new Date(a.ts)));
    app.innerHTML = `
      <div class="topline"><h1>評価の一覧</h1><span class="who">${items.length}件</span></div>
      <div class="card">
        <label for="lessonFilter">授業でしぼりこむ</label>
        <select id="lessonFilter">
          <option value="">すべて</option>
          ${lessons.map(l=>`<option value="${esc(lessonFullName(l))}">${esc(lessonFullName(l))}</option>`).join('')}
        </select>
      </div>
      <div id="summary" style="margin-bottom:14px;font-size:.85rem;color:var(--ink-soft);"></div>
      <div id="gradedItems"></div>
      <footer class="note"><button class="link-btn" id="backBtn">先生用トップに戻る</button></footer>
    `;
    document.getElementById('backBtn').addEventListener('click', ()=>renderAdminHub(pw, apikey, rubric));

    function draw(){
      const lesson = document.getElementById('lessonFilter').value;
      const filtered = lesson ? items.filter(it=>it.lesson===lesson) : items;
      const graded = filtered.filter(it=>it.score !== '' && it.score !== undefined && it.score !== null);
      const summaryEl = document.getElementById('summary');
      if (graded.length){
        const avg = (graded.reduce((s,it)=>s+Number(it.score||0),0) / graded.length).toFixed(1);
        summaryEl.textContent = `評価済み ${graded.length}件 / 未評価 ${filtered.length - graded.length}件 ・ 平均点 ${avg}`;
      } else {
        summaryEl.textContent = `評価済み 0件 / 未評価 ${filtered.length}件`;
      }
      document.getElementById('gradedItems').innerHTML = filtered.map(it=>{
        const isGraded = it.score !== '' && it.score !== undefined && it.score !== null;
        return `
          <div class="admin-item">
            <div class="meta"><span>${esc(it.studentName)} / ${fmtDate(it.ts)}</span>
              <span class="badge ${isGraded?'':'err'}">${isGraded ? '評価済 '+esc(it.score) : '未評価'}</span>
            </div>
            <div style="font-family:'Shippori Mincho',serif;font-weight:700;margin-bottom:4px;">${esc(it.lesson)}</div>
            <div style="font-size:.9rem;margin-bottom:8px;">${esc(it.text)}</div>
            ${isGraded ? `<div class="grade-box graded">${esc(it.comment)}</div>` : ''}
          </div>`;
      }).join('') || '<p class="empty">該当する記録がありません。</p>';
    }
    document.getElementById('lessonFilter').addEventListener('change', draw);
    draw();
  }).catch(()=>{
    app.innerHTML = `<div class="card"><p class="msg err">通信に失敗しました。</p></div>`;
  });
}

/* ---------------- 授業構成の設定ページ ---------------- */
let editRows = [];

function renderLessonSettings(pw, apikey, rubric){
  app.innerHTML = `<p class="empty">読み込み中…</p>`;
  getLessons().then(lessons=>{
    editRows = lessons.map(l => ({tani:l.tani, sho:l.sho, koji:l.koji}));
    app.innerHTML = `
      <div class="topline"><h1>授業構成の設定</h1></div>
      <div class="card">
        <p style="font-size:.85rem;color:var(--ink-soft);margin:0 0 12px;">単元・章・校時を入力して「追加」を押してください。同じ単元名・章名を使うとその下にまとまります。</p>
        <div class="add-row">
          <input type="text" id="newTani" placeholder="単元 (例: 単元1)">
          <input type="text" id="newSho" placeholder="章 (例: 第1章)">
          <input type="text" id="newKoji" placeholder="校時 (例: 第1校時)">
        </div>
        <button class="btn-main" id="addRowBtn">追加</button>
      </div>
      <div id="tree"></div>
      <div class="card row2">
        <button class="btn-main" id="saveBtn">保存する</button>
        <button class="btn-ghost" id="backBtn">先生用トップに戻る(保存せず)</button>
      </div>
      <div class="msg" id="settingsMsg"></div>
    `;
    drawTree();
    document.getElementById('addRowBtn').addEventListener('click', ()=>{
      const tani = document.getElementById('newTani').value.trim();
      const sho = document.getElementById('newSho').value.trim();
      const koji = document.getElementById('newKoji').value.trim();
      if (!tani || !koji){
        document.getElementById('settingsMsg').className='msg err';
        document.getElementById('settingsMsg').textContent='単元と校時は必須です(章は空でも可)。';
        return;
      }
      editRows.push({tani:tani, sho:sho, koji:koji});
      document.getElementById('newSho').value=''; document.getElementById('newKoji').value='';
      document.getElementById('settingsMsg').textContent='';
      drawTree();
    });
    document.getElementById('backBtn').addEventListener('click', ()=>renderAdminHub(pw, apikey, rubric));
    document.getElementById('saveBtn').addEventListener('click', async ()=>{
      const btn = document.getElementById('saveBtn');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>保存中…';
      const msg = document.getElementById('settingsMsg');
      try {
        await db.collection('lessons').doc('config').set({ tree: editRows });
        btn.disabled = false; btn.textContent = '保存する';
        msg.className='msg ok'; msg.textContent = '保存しました。生徒ページに反映されます。';
      } catch (err){
        btn.disabled = false; btn.textContent = '保存する';
        msg.className='msg err'; msg.textContent = '保存に失敗しました。';
      }
    });
  }).catch(()=>{
    app.innerHTML = `<div class="card"><p class="msg err">通信に失敗しました。</p></div>`;
  });
}

function drawTree(){
  const el = document.getElementById('tree');
  if (!editRows.length){
    el.innerHTML = '<p class="empty">まだ何も登録されていません。上のフォームから追加してください。</p>';
    return;
  }
  const tanis = [...new Set(editRows.map(r=>r.tani))];
  el.innerHTML = tanis.map(tani=>{
    const rowsForTani = editRows.filter(r=>r.tani===tani);
    const shos = [...new Set(rowsForTani.map(r=>r.sho))];
    return `<div class="tani-group">
      <div class="tani-title">${esc(tani)}</div>
      ${shos.map(sho=>{
        const rowsForSho = editRows.filter(r=>r.tani===tani && r.sho===sho);
        return `<div class="sho-group">
          ${sho ? `<div class="sho-title">${esc(sho)}</div>` : ''}
          <div>
            ${rowsForSho.map(r=>{
              const idx = editRows.indexOf(r);
              return `<span class="koji-chip">${esc(r.koji)}<button data-idx="${idx}">×</button></span>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
  el.querySelectorAll('.koji-chip button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      editRows.splice(Number(btn.dataset.idx), 1);
      drawTree();
    });
  });
}
